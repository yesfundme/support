<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YesFUNDme Campaign</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .campaign-hero-img { width:100%; height:260px; object-fit:cover; border-radius:var(--radius-card); background:#EDEFE8; }
  .modal-backdrop { position:fixed; inset:0; background:rgba(22,36,28,0.5); display:none; align-items:center; justify-content:center; z-index:50; padding:16px; }
  .modal-backdrop.open { display:flex; }
  .modal { background:var(--surface); border-radius:var(--radius-card); padding:24px; max-width:420px; width:100%; max-height:90vh; overflow-y:auto; }
  .share-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  .share-btn { padding:10px 16px; border-radius:var(--radius-pill); border:1.5px solid var(--line); font-size:14px; cursor:pointer; background:var(--surface); }
  .checkbox-row { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:14px; }
  .method-btn.active { border-color:var(--green) !important; color:var(--green); background:#EAF4EE !important; }
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-logo"><span class="brand-yes">Yes</span><span class="brand-fund">FUNDme</span></div>
  <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
  <div class="nav-links"><a href="index.html" id="navHomeLink">Home</a><a href="search.html">Campaigns</a></div>
</nav>

<div class="container" id="app" style="padding:32px 20px 60px;">
  <p>Loading campaign…</p>
</div>

<div class="modal-backdrop" id="checkoutModal">
  <div class="modal">
    <h3 style="margin-bottom:16px;">Your Support</h3>
    <div id="checkoutSummary"></div>
    <div class="checkout-total">
      <span>Total</span>
      <strong id="checkoutTotal">KSh 0</strong>
    </div>
    <div id="fxEstimate" style="display:none;text-align:right;font-size:13px;color:var(--ink-soft);margin-top:-8px;margin-bottom:10px;"></div>

    <div class="form-field" style="margin-top:14px;">
      <label>Your Name (optional)</label>
      <input type="text" id="supporterName" placeholder="e.g. Mary W.">
    </div>
    <div class="checkbox-row"><input type="checkbox" id="showNamePublicly" checked> <label for="showNamePublicly">Show my name publicly</label></div>
    <div class="checkbox-row"><input type="checkbox" id="isAnonymous"> <label for="isAnonymous">Support anonymously</label></div>
    <div class="form-field">
      <label>Leave a message of support (optional)</label>
      <textarea id="supporterMessage" rows="2"></textarea>
    </div>

    <div class="form-field">
      <label>Payment Method</label>
      <div class="method-toggle" style="display:flex;gap:10px;">
        <button type="button" id="btnMpesaMethod" class="method-btn active" onclick="setPaymentMethod('mpesa')" style="flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;">M-Pesa</button>
        <button type="button" id="btnCardMethod" class="method-btn" onclick="setPaymentMethod('card')" style="flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;">Card</button>
      </div>
    </div>
    <div class="form-field" id="phoneField">
      <label>M-Pesa Phone Number</label>
      <input type="tel" id="supporterPhone" placeholder="07XXXXXXXX">
    </div>

    <div class="error-banner" id="checkoutError"></div>
    <div id="checkoutStatus" style="display:none;font-size:14px;color:var(--ink-soft);margin-bottom:10px;"></div>

    <button class="btn btn-primary btn-block" id="payBtn">Support Now</button>
    <button class="btn btn-secondary btn-block" style="margin-top:10px;" onclick="closeModal()">Cancel</button>
  </div>
</div>

<script src="js/api.js"></script>
<script>
const slug = new URLSearchParams(location.search).get('slug') || location.pathname.split('/').pop();
let campaignData = null;
let paymentMethod = 'mpesa';
const cart = {}; // support_item_id -> { name, price, quantity }
let customAmount = 0;

// If the visitor is logged in, "Home" becomes "Dashboard" so campaign owners
// (and any logged-in supporter) can get back to their own account easily.
if (localStorage.getItem('fundme_token')) {
  const homeLink = document.getElementById('navHomeLink');
  homeLink.textContent = 'Dashboard';
  homeLink.href = 'dashboard.html';
}

// Currency handling: everything charged to Paystack is ALWAYS in KES,
// for every payer, on every method — that never changes. What changes for
// a visitor detected outside Kenya is purely DISPLAY: item prices, the
// running total, and the checkout summary render in USD instead of KSh,
// converted at a live rate. Internally every amount (cart totals, the
// custom-amount field, what's sent to /payments/initialize) stays in KES,
// so the backend and Paystack integration need no currency changes at all.
let isInternationalVisitor = false;
let kesToUsdRate = null;

async function fetchUsdRate() {
  if (kesToUsdRate) return kesToUsdRate;
  try {
    const rateRes = await fetch('https://open.er-api.com/v6/latest/KES');
    const rateData = await rateRes.json();
    kesToUsdRate = rateData.rates && rateData.rates.USD;
    console.log('FUNDme: KES→USD rate in use:', kesToUsdRate);
  } catch (e) { /* rate stays null - formatMoney falls back to KSh */ }
  return kesToUsdRate;
}

// A campaign can force USD display for every visitor regardless of location
// (campaigns.display_currency = 'usd' in the database) - useful for
// internationally-facing appeals. Otherwise it falls back to per-visitor
// IP-based detection as before. Either way, only the display changes -
// amounts sent to the backend/Paystack always stay in KES.
async function detectVisitorCurrency(campaign) {
  if (campaign && campaign.display_currency === 'usd') {
    isInternationalVisitor = true;
  } else if (new URLSearchParams(location.search).get('intl') === '1') {
    // Testing hook: open the page with ?intl=1 to preview the USD path
    // without needing a VPN or an actual campaign override.
    isInternationalVisitor = true;
  } else {
    try {
      const res = await fetch('https://ipapi.co/json/');
      if (res.ok) {
        const geo = await res.json();
        isInternationalVisitor = !!(geo.country_code && geo.country_code !== 'KE');
      }
    } catch (e) { /* default: treat as Kenyan (KSh), the safe default */ }
  }

  if (isInternationalVisitor) await fetchUsdRate();
}

// Formats a KES amount for display: USD for international visitors (when a
// rate was successfully fetched), KSh for everyone else - Kenyan visitors
// are completely unaffected either way.
function formatMoney(amountKes) {
  if (isInternationalVisitor && kesToUsdRate) {
    return `$${(amountKes * kesToUsdRate).toFixed(2)}`;
  }
  return formatKsh(amountKes);
}

function setPaymentMethod(m) {
  paymentMethod = m;
  document.getElementById('btnMpesaMethod').classList.toggle('active', m === 'mpesa');
  document.getElementById('btnCardMethod').classList.toggle('active', m === 'card');
  document.getElementById('phoneField').style.display = m === 'mpesa' ? 'block' : 'none';
}

const categoryLabels = {
  funeral: 'Funeral Support', wedding: 'Wedding Support', hospital: 'Hospital Bills Support',
  campaign: 'Campaign Funding', birthday: 'Birthday Support', food: 'Food Support'
};

async function load() {
  try {
    const data = await apiRequest(`/campaigns/${slug}`);
    campaignData = data;
    await detectVisitorCurrency(data.campaign);
    if (isInternationalVisitor) setPaymentMethod('card');
    render(data);
  } catch (err) {
    document.getElementById('app').innerHTML = `<p>Campaign not found.</p>`;
  }
}

function render(data) {
  const c = data.campaign;
  const pct = c.target_amount > 0 ? Math.min(100, Math.round((c.amount_collected / c.target_amount) * 100)) : 0;

  document.getElementById('app').innerHTML = `
    ${c.image_url ? `<img class="campaign-hero-img" src="${c.image_url}" alt="">` : ''}
    <div style="margin-top:20px;">
      <span class="pill" style="background:#EAF4EE;color:var(--green);padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;">${categoryLabels[c.category] || c.category}</span>
      <h1 style="font-size:28px;margin-top:12px;">${c.title}</h1>
      <p style="margin-top:6px;">Organized by ${c.beneficiary_name || 'YesFUNDme user'}${c.location ? ' · ' + c.location : ''}</p>
    </div>

    <div class="card" style="margin-top:20px;">
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="receipt-figures" style="margin-top:10px;">
        <span><strong>${formatKsh(c.amount_collected)}</strong> raised</span>
        <span>of ${formatKsh(c.target_amount)}</span>
      </div>
      <div class="receipt-figures" style="margin-top:8px;">
        <span>${data.supporters_count} Supporters</span>
        <span style="color:var(--green);font-weight:600;text-transform:capitalize;">${c.status}</span>
      </div>
      <div class="share-row">
        <button class="share-btn" onclick="copyLink()">Copy Link</button>
        <a class="share-btn" target="_blank" href="https://wa.me/?text=${encodeURIComponent('Support ' + c.title + ': ' + location.href)}">WhatsApp</a>
        <a class="share-btn" target="_blank" href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}">Facebook</a>
        <a class="share-btn" target="_blank" href="https://twitter.com/intent/tweet?url=${encodeURIComponent(location.href)}">X</a>
        <a class="share-btn" target="_blank" href="https://t.me/share/url?url=${encodeURIComponent(location.href)}">Telegram</a>
      </div>
    </div>

    ${c.description ? `<div class="card" style="margin-top:20px;"><h3 style="margin-bottom:10px;">About this campaign</h3><div style="white-space:pre-line;">${c.description}</div></div>` : ''}

    <div class="card" style="margin-top:20px;">
      <h3 style="margin-bottom:6px;">Choose your support</h3>
      <p>Every item represents financial support — pick as many as you like.</p>
      <div class="support-grid" id="supportGrid"></div>

      <div class="form-field" style="margin-top:10px;">
        <label id="customAmountLabel">Or enter a custom amount (KSh)</label>
        <input type="number" min="10" id="customAmountInput" placeholder="e.g. 500">
      </div>

      <div class="checkout-total">
        <span>Total</span>
        <strong id="liveTotal">KSh 0</strong>
      </div>
      <button class="btn btn-primary btn-block" onclick="openModal()">Support Now</button>
      <p class="form-note" style="margin-top:14px;"><a href="report.html?slug=${c.public_slug}">Report this campaign</a></p>
    </div>
  `;

  const grid = document.getElementById('supportGrid');
  data.support_items.forEach((item) => {
    cart[item.id] = { name: item.name, price: Number(item.price), quantity: 0 };
    const el = document.createElement('div');
    el.className = 'support-item';
    el.innerHTML = `
      <span class="emoji">${item.icon}</span>
      <div>${item.name}</div>
      <div class="price" id="price-${item.id}">${formatMoney(item.price)}</div>
      <div class="qty-controls">
        <button class="qty-btn" onclick="changeQty('${item.id}', -1)">−</button>
        <span id="qty-${item.id}">0</span>
        <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
      </div>
    `;
    grid.appendChild(el);
  });

  // International visitors type their custom amount in USD; it's converted
  // back to KES immediately so cartTotal() - and everything sent to the
  // backend - always stays in KES underneath.
  if (isInternationalVisitor && kesToUsdRate) {
    document.getElementById('customAmountLabel').textContent = 'Or enter a custom amount (USD)';
    document.getElementById('customAmountInput').placeholder = 'e.g. 10';
  }

  document.getElementById('customAmountInput').addEventListener('input', (e) => {
    const typed = Number(e.target.value) || 0;
    customAmount = (isInternationalVisitor && kesToUsdRate) ? typed / kesToUsdRate : typed;
    updateTotal();
  });
}

function changeQty(id, delta) {
  cart[id].quantity = Math.max(0, cart[id].quantity + delta);
  document.getElementById(`qty-${id}`).textContent = cart[id].quantity;
  updateTotal();
}

function cartTotal() {
  return Object.values(cart).reduce((sum, it) => sum + it.quantity * it.price, 0) + customAmount;
}

function updateTotal() {
  document.getElementById('liveTotal').textContent = formatMoney(cartTotal());
}

function openModal() {
  const total = cartTotal();
  if (total < 10) { alert('Please choose a support item or enter an amount of at least KSh 10.'); return; }

  const summaryEl = document.getElementById('checkoutSummary');
  const lines = Object.values(cart)
    .filter((it) => it.quantity > 0)
    .map((it) => `<div class="receipt-figures" style="margin-bottom:6px;"><span>${it.name} × ${it.quantity}</span><span>${formatMoney(it.quantity * it.price)}</span></div>`);
  if (customAmount > 0) lines.push(`<div class="receipt-figures"><span>Custom Support</span><span>${formatMoney(customAmount)}</span></div>`);
  summaryEl.innerHTML = lines.join('') || '<p>Custom support</p>';
  document.getElementById('checkoutTotal').textContent = formatMoney(total);

  // Transparency note: when the displayed total is in USD, show the actual
  // KES amount that gets charged underneath - nothing about the real charge
  // ever changes, this just tells the payer what number their bank will see.
  const fxEl = document.getElementById('fxEstimate');
  if (isInternationalVisitor && kesToUsdRate) {
    fxEl.textContent = `Charged as ${formatKsh(total)} (your bank applies its own exchange rate)`;
    fxEl.style.display = 'block';
  } else {
    fxEl.style.display = 'none';
  }

  document.getElementById('checkoutModal').classList.add('open');
}

function closeModal() {
  document.getElementById('checkoutModal').classList.remove('open');
}

document.getElementById('showNamePublicly').addEventListener('change', (e) => {
  if (e.target.checked) document.getElementById('isAnonymous').checked = false;
});
document.getElementById('isAnonymous').addEventListener('change', (e) => {
  if (e.target.checked) document.getElementById('showNamePublicly').checked = false;
});

function copyLink() {
  navigator.clipboard.writeText(location.href);
  alert('Campaign link copied!');
}

document.getElementById('payBtn').addEventListener('click', async () => {
  const errorEl = document.getElementById('checkoutError');
  const statusEl = document.getElementById('checkoutStatus');
  errorEl.style.display = 'none';

  const phone = document.getElementById('supporterPhone').value;
  if (paymentMethod === 'mpesa' && !phone) {
    errorEl.textContent = 'Please enter your M-Pesa phone number.';
    errorEl.style.display = 'block';
    return;
  }

  const isAnonymous = document.getElementById('isAnonymous').checked;
  const showNamePublicly = document.getElementById('showNamePublicly').checked;
  const items = Object.entries(cart)
    .filter(([, it]) => it.quantity > 0)
    .map(([id, it]) => ({ support_item_id: id, name: it.name, quantity: it.quantity, unit_price: it.price }));

  try {
    document.getElementById('payBtn').disabled = true;
    const result = await apiRequest('/payments/initialize', {
      method: 'POST',
      body: {
        campaign_id: campaignData.campaign.id,
        amount: cartTotal(),
        method: paymentMethod,
        phone: paymentMethod === 'mpesa' ? phone : undefined,
        callback_url: paymentMethod === 'card' ? `${location.origin}${location.pathname}?slug=${slug}` : undefined,
        supporter_name: document.getElementById('supporterName').value,
        message: document.getElementById('supporterMessage').value,
        show_name_publicly: showNamePublicly,
        is_anonymous: isAnonymous,
        items
      }
    });

    if (result.method === 'card') {
      // Hand off to Paystack's hosted card checkout. Paystack redirects back
      // to callback_url (with ?reference=...) once the supporter finishes.
      window.location.href = result.authorization_url;
      return;
    }

    statusEl.style.display = 'block';
    statusEl.textContent = result.display_text || 'Check your phone to complete payment on M-Pesa.';
    pollStatus(result.reference);
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
    document.getElementById('payBtn').disabled = false;
  }
});

async function pollStatus(reference) {
  const statusEl = document.getElementById('checkoutStatus');
  statusEl.style.display = 'block';
  for (let i = 0; i < 20; i++) {
    await new Promise((r) => setTimeout(r, 3000));
    try {
      const data = await apiRequest(`/payments/${reference}/status`);
      if (data.status === 'successful') {
        statusEl.textContent = 'Thank you! Your support was received successfully.';
        setTimeout(() => { closeModal(); load(); }, 1800);
        return;
      }
      if (data.status === 'failed') {
        statusEl.textContent = 'Payment was not completed. Please try again.';
        document.getElementById('payBtn').disabled = false;
        return;
      }
    } catch (e) { /* keep polling */ }
  }
  statusEl.textContent = 'Still waiting for confirmation — this can take a moment.';
  document.getElementById('payBtn').disabled = false;
}

// If the supporter just landed back here from Paystack's card checkout
// (reference/trxref appended to the URL), pick up polling immediately.
const returnedReference = new URLSearchParams(location.search).get('reference')
  || new URLSearchParams(location.search).get('trxref');
if (returnedReference) {
  document.getElementById('checkoutModal').classList.add('open');
  document.getElementById('checkoutSummary').innerHTML = '<p>Finishing up your card payment…</p>';
  document.getElementById('payBtn').style.display = 'none';
  pollStatus(returnedReference);
}

load();
</script>
<script>
function toggleNav() {
  document.querySelector('.nav-links').classList.toggle('open');
}
document.querySelectorAll('.nav-links a').forEach(function(a) {
  a.addEventListener('click', function() {
    document.querySelector('.nav-links').classList.remove('open');
  });
});
</script>
</body>
</html>
