<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find a campaign — YesFUNDme</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-logo"><span class="brand-yes">Yes</span><span class="brand-fund">FUNDme</span></div>
  <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
  <div class="nav-links"><a href="index.html">Home</a><a href="login.html">Login</a></div>
</nav>

<div class="container" style="padding:32px 20px 60px;">
  <h1 style="font-size:28px;margin-bottom:16px;">Find a campaign</h1>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;">
    <input type="text" id="q" placeholder="Search by name or organizer" style="flex:1;min-width:200px;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);">
    <select id="category" style="padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);">
      <option value="">All categories</option>
      <option value="funeral">Funeral Support</option>
      <option value="wedding">Wedding Support</option>
      <option value="hospital">Hospital Bills Support</option>
      <option value="campaign">Campaign Funding</option>
      <option value="birthday">Birthday Support</option>
      <option value="food">Food Support</option>
    </select>
    <button class="btn btn-primary" onclick="search()">Search</button>
  </div>
  <div id="results" class="category-grid"></div>
</div>

<script src="js/api.js"></script>
<script>
async function search() {
  const q = document.getElementById('q').value;
  const category = document.getElementById('category').value;
  const params = new URLSearchParams();
  if (q) params.set('q', q);
  if (category) params.set('category', category);

  const { campaigns } = await apiRequest(`/campaigns/search?${params}`);
  const box = document.getElementById('results');
  box.innerHTML = campaigns.length ? campaigns.map((c) => `
    <div class="category-card" onclick="location.href='campaign.html?slug=${c.public_slug}'">
      <h3>${c.title}</h3>
      <p>${c.beneficiary_name || ''}${c.location ? ' · ' + c.location : ''}</p>
      <p style="margin-top:8px;font-weight:600;color:var(--green);">${formatKsh(c.amount_collected)} raised</p>
    </div>
  `).join('') : '<p>No campaigns found.</p>';
}
search();
</script>
<script>
function toggleNav() {
  document.querySelector('.nav-links').classList.toggle('open');
}
document.querySelectorAll('.nav-links a').forEach(function(a) {
  a.addEventListener('click', function() {
    document.querySelector('.nav-links').classList.remove('open');
  });
});
</script>
</body>
</html>
