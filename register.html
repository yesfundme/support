<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create your account — YesFUNDme</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-logo"><span class="brand-yes">Yes</span><span class="brand-fund">FUNDme</span></div>
  <button class="nav-toggle" onclick="toggleNav()" aria-label="Menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
  <div class="nav-links"><a href="index.html">Home</a></div>
</nav>

<div class="container">
  <div class="card form-card">
    <h2 style="margin-bottom:6px;">Create your account</h2>
    <p style="margin-bottom:24px;">Just a few details — no verification codes needed.</p>

    <div class="error-banner" id="error"></div>

    <form id="registerForm">
      <div class="form-field">
        <label>Full Name</label>
        <input type="text" id="full_name" placeholder="Official name as it appears on your official document" required>
      </div>
      <div class="form-field">
        <label>Email Address</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-field">
        <label>Country</label>
        <div id="countryDisplay" style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);">
          <span id="countryName" style="font-size:15px;">Detecting…</span>
          <a href="#" id="changeCountryLink" style="font-size:13px;color:var(--green);font-weight:600;">Change</a>
        </div>
        <select id="country" style="display:none;margin-top:8px;">
          <option value="KE">Kenya</option>
          <option value="OTHER">Other country</option>
        </select>
      </div>
      <div class="form-field" id="idNumberField">
        <label>ID Number</label>
        <input type="text" id="id_number" inputmode="numeric" placeholder="Your national ID number">
      </div>
      <div class="form-field">
        <label>Date of Birth</label>
        <input type="date" id="date_of_birth" required>
      </div>
      <div class="form-field">
        <label>Password</label>
        <input type="password" id="password" minlength="6" required>
      </div>
      <div class="form-field">
        <label>Confirm Password</label>
        <input type="password" id="confirm_password" minlength="6" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="form-note">Already have an account? <a href="login.html">Login</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(location.search);
const category = params.get('category') || '';

// ID number is collected for Kenyan users only.
const countrySelect = document.getElementById('country');
const idNumberField = document.getElementById('idNumberField');
const countryName = document.getElementById('countryName');

function applyCountry(code, label) {
  countrySelect.value = code;
  countryName.textContent = label;
  idNumberField.style.display = code === 'KE' ? 'block' : 'none';
}

countrySelect.addEventListener('change', () => {
  applyCountry(countrySelect.value, countrySelect.value === 'KE' ? 'Kenya' : 'Other country');
});

// Let the user correct the detected country. IP lookups get it wrong often
// enough (VPNs, mobile carriers routing abroad) that a Kenyan user must
// always be able to switch back and enter their ID number.
document.getElementById('changeCountryLink').addEventListener('click', (e) => {
  e.preventDefault();
  document.getElementById('countryDisplay').style.display = 'none';
  countrySelect.style.display = 'block';
  countrySelect.style.marginTop = '0';
});

// Detect the country from the visitor's IP so most people never touch this.
(async function detectCountry() {
  applyCountry('KE', 'Kenya'); // safe default while the lookup runs

  // Testing hooks: append ?country=OTHER to preview the non-Kenyan path
  // (ID field hidden), or ?country=KE to force the Kenyan path, without
  // needing a VPN. Real visitors never hit these.
  const forced = new URLSearchParams(location.search).get('country');
  if (forced === 'OTHER') { applyCountry('OTHER', 'Other country (test)'); return; }
  if (forced === 'KE') { applyCountry('KE', 'Kenya'); return; }

  try {
    const res = await fetch('https://ipapi.co/json/');
    if (!res.ok) return;
    const geo = await res.json();
    if (geo.country_code === 'KE') {
      applyCountry('KE', 'Kenya');
    } else if (geo.country_code) {
      applyCountry('OTHER', geo.country_name || 'Other country');
    }
  } catch (e) { /* leave the Kenya default in place */ }
})();

// Registration is for adults only, so the date picker can't offer anything
// later than 18 years ago. The same rule is enforced on the server.
const eighteenYearsAgo = new Date();
eighteenYearsAgo.setFullYear(eighteenYearsAgo.getFullYear() - 18);
document.getElementById('date_of_birth').max = eighteenYearsAgo.toISOString().split('T')[0];

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const errorEl = document.getElementById('error');
  errorEl.style.display = 'none';

  try {
    const data = await apiRequest('/auth/register', {
      method: 'POST',
      body: {
        full_name: document.getElementById('full_name').value,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value,
        confirm_password: document.getElementById('confirm_password').value,
        date_of_birth: document.getElementById('date_of_birth').value,
        country: document.getElementById('country').value,
        id_number: document.getElementById('id_number').value
      }
    });
    localStorage.setItem('fundme_token', data.token);
    localStorage.setItem('fundme_user', JSON.stringify(data.user));
    window.location.href = `create-campaign.html?category=${category}`;
  } catch (err) {
    errorEl.textContent = err.message;
    errorEl.style.display = 'block';
  }
});
</script>
<script>
function toggleNav() {
  document.querySelector('.nav-links').classList.toggle('open');
}
document.querySelectorAll('.nav-links a').forEach(function(a) {
  a.addEventListener('click', function() {
    document.querySelector('.nav-links').classList.remove('open');
  });
});
</script>
</body>
</html>
