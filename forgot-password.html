<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password — YesFUNDme</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav"><div class="nav-logo"><span class="brand-yes">Yes</span><span class="brand-fund">FUNDme</span></div><button class="nav-toggle" onclick="toggleNav()" aria-label="Menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg></button>
  <div class="nav-links"><a href="login.html">Login</a></div></nav>
<div class="container">
  <div class="card form-card">
    <h2 style="margin-bottom:6px;">Reset your password</h2>
    <p style="margin-bottom:24px;">Enter your email and we'll send you a reset link.</p>
    <div class="form-field"><label>Email Address</label><input type="email" id="email" required></div>
    <button class="btn btn-primary btn-block" onclick="alert('If an account exists for this email, a reset link has been sent.')">Send Reset Link</button>
    <p class="form-note"><a href="login.html">Back to login</a></p>
  </div>
</div>
<script>
function toggleNav() {
  document.querySelector('.nav-links').classList.toggle('open');
}
document.querySelectorAll('.nav-links a').forEach(function(a) {
  a.addEventListener('click', function() {
    document.querySelector('.nav-links').classList.remove('open');
  });
});
</script>
</body>
</html>
